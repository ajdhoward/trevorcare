# Deploy the AI worker to Cloudflare on every push to main.
# Required repo secret: CLOUDFLARE_API_TOKEN (template: "Edit Cloudflare Workers")
# Optional: CLOUDFLARE_ACCOUNT_ID

name: Deploy AI Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install worker dependencies
        working-directory: cloudflare-worker
        run: bun install

      - name: Deploy worker
        working-directory: cloudflare-worker
        run: bunx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
